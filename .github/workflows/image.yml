name: Container image
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the release installer
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from textwrap import dedent

          tag = os.environ["GITHUB_REF_NAME"]
          manifest = Path("Apps/Folbum/docker-compose.yml").read_text()
          readme = Path("README.md").read_text()
          block = re.search(r"^   ```yaml\n(.*?)^   ```$", readme, re.M | re.S)
          if not block or dedent(block[1]) != manifest:
              raise SystemExit("The README installer must match the release Compose file.")
          images = re.findall(r"^    image: (.+)$", manifest, re.M)
          if not images or set(images) != {f"ghcr.io/theashutoshn/folbum:{tag}"}:
              raise SystemExit(f"The installer must use the release image for {tag}.")
          PY
          docker compose -f Apps/Folbum/docker-compose.yml config --quiet
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/theashutoshn/folbum:${{ github.ref_name }}
