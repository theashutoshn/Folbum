name: zima-album-sync
services:
  album-sync:
    build: .
    image: zima-album-sync:local
    container_name: zima-album-sync
    ports:
      - "8765:8765"
    environment:
      DATA_DIR: /app/data
    volumes:
      - app-data:/app/data
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    pids_limit: 100
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health',timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
volumes:
  app-data:
