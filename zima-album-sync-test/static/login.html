<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Zima Album Sync</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <main class="login-panel" aria-labelledby="login-title">
    <div class="login-brand"><span class="brand-mark" aria-hidden="true">▣</span><span>Zima Album Sync</span></div>
    <div class="login-copy">
      <span class="eyebrow">WELCOME BACK</span>
      <h1 id="login-title">Sign in</h1>
      <p>Open your album dashboard and sync settings.</p>
    </div>
    <form id="loginForm" class="login-form">
      <label for="loginUsername">Username</label>
      <input id="loginUsername" name="username" value="admin" autocomplete="username" required>
      <label for="loginPassword">Password</label>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" required autofocus>
      <label class="remember-option"><input id="rememberLogin" type="checkbox" checked><span>Stay signed in on this device for 30 days</span></label>
      <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
      <button id="loginButton" class="primary" type="submit">Sign in</button>
    </form>
    <div class="login-footer"><span>Use your Zima Album Sync password.</span><span>v0.0.1</span></div>
  </main>
  <script src="/login.js"></script>
</body>
</html>
