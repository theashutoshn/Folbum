name: zima-album-sync
services:
  album-sync:
    build: .
    image: zima-album-sync:local
    container_name: zima-album-sync
    ports:
      - "${BIND_IP:-127.0.0.1}:${APP_PORT:-8765}:8765"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "8765"
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    pids_limit: 100
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health',timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
volumes:
  app-data:
